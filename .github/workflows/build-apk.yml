name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  lint:
    name: Kotlin lint (ktlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      # 로컬 lint.ps1 과 동일한 ktlint 버전/대상을 사용해 결과가 항상 일치하도록 한다.
      - name: Download ktlint
        run: curl -sSLo ktlint.jar https://github.com/pinterest/ktlint/releases/download/1.3.1/ktlint
      - name: ktlint check
        run: java -jar ktlint.jar "app/src/**/*.kt" "*.kts" "app/*.kts"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 실제 Firebase 설정은 GitHub Secret(GOOGLE_SERVICES_JSON)에서 주입.
      # 시크릿이 없으면 자리표시자로 빌드만 통과시킨다 (앱 통신은 안 됨).
      - name: Prepare google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "Using real google-services.json from secret"
          else
            cp app/google-services.json.example app/google-services.json
            echo "WARNING: using placeholder google-services.json (Firebase will not work)"
          fi

      - name: Unit tests
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --no-daemon

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v5
        with:
          name: morning-alarm-apk
          path: app/build/outputs/apk/debug/app-debug.apk
